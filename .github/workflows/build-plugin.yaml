name: Build and release MOS Llama
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing numeric tag to publish'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mos-llama-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version && format('refs/tags/{0}', github.event.inputs.version) || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-release.py
          VERSION=$(node --input-type=module -e 'import c from "./page/plugin.config.js"; console.log(c.version)')
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${{ github.ref_type }}" == tag ]]; then
            TAG="${{ github.event.inputs.version || github.ref_name }}"
            [[ "$TAG" == "$VERSION" ]] || { echo 'Tag/version mismatch'; exit 1; }
            [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: page
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate scripts and frontend
        run: |
          set -euo pipefail
          bash -n llama_backend llama_router functions scripts/package-local.sh
          python3 tests/test_backend.py
          python3 tests/test_coexistence.py
          npm --prefix page run build
      - name: Build and inspect package
        run: |
          set -euo pipefail
          scripts/package-local.sh "${{ steps.identity.outputs.version }}"
          dpkg-deb -c artifacts/*.deb > "$RUNNER_TEMP/package-contents.txt"
          grep -Fq /usr/bin/plugins/llama_backend "$RUNNER_TEMP/package-contents.txt"
          grep -Fq /usr/bin/plugins/llama_router "$RUNNER_TEMP/package-contents.txt"
          if grep -Fq /usr/bin/plugins/llama_swap "$RUNNER_TEMP/package-contents.txt"; then echo "Old plugin file collision" >&2; exit 1; fi
          grep -Fq /var/www/mos-plugins/llama/manifest.json "$RUNNER_TEMP/package-contents.txt"
          sha256sum artifacts/*.deb > artifacts/llama-${{ steps.identity.outputs.version }}-1+mos-plugin_all.deb.sha256
          md5sum artifacts/*.deb > artifacts/llama-${{ steps.identity.outputs.version }}-1+mos-plugin_all.deb.md5
          git archive --format=zip --output="artifacts/mos-llama-${{ steps.identity.outputs.version }}-source.zip" HEAD
          test "$(stat -c%s artifacts/mos-llama-${{ steps.identity.outputs.version }}-source.zip)" -lt 10485760
      - uses: actions/upload-artifact@v4
        with:
          name: mos-llama-${{ steps.identity.outputs.version }}
          path: artifacts/*.deb*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mos-llama-source-${{ steps.identity.outputs.version }}
          path: artifacts/*-source.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mos-llama-*
          merge-multiple: true
          path: artifacts
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -f "artifacts/llama-${TAG}-1+mos-plugin_all.deb"
          test -f "artifacts/mos-llama-${TAG}-source.zip"
          sha256sum -c "artifacts/llama-${TAG}-1+mos-plugin_all.deb.sha256"
          md5sum -c "artifacts/llama-${TAG}-1+mos-plugin_all.deb.md5"
          ! gh release view "$TAG" >/dev/null 2>&1
          gh release create "$TAG" artifacts/* --verify-tag --draft --title "MOS Llama $TAG" --notes 'Initial MOS Llama integration preview. Hardware installation and reboot recovery are not yet qualified; install only in a controlled test environment.'
          gh release edit "$TAG" --draft=false --latest
